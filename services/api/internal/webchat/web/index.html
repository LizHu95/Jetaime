<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f0"><title>Jetaime · 我一直都在</title><link rel="stylesheet" href="style.css"></head>
<body>
<section class="auth" id="auth"><div class="auth-card"><div class="brand">J<span>✳</span></div><p class="eyebrow">JETAIME · 共享聊天室</p><h1>聊聊今天，<br>我一直都在。</h1><p class="muted">用自己的账号加入，一起留下日常。</p><form id="auth-form"><label>用户名<input id="name" name="username" autocomplete="username" minlength="2" maxlength="24" required placeholder="怎么称呼你"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="72" required placeholder="至少 10 位"></label><label id="invite-label" hidden>邀请码<input id="invite" name="invite" autocomplete="off" placeholder="向聊天室创建者获取"></label><p class="notice" id="auth-error" role="alert" hidden></p><button class="primary" id="auth-submit">登录聊天室 <span>↗</span></button></form><button class="text-button" id="auth-switch">第一次来？注册账号</button><p class="privacy">这是共享房间，加入的成员可以看到房间消息。</p></div></section>
<div class="shell" id="shell" hidden><aside class="sidebar"><div class="brand">J<span>✳</span></div><h2>Jetaime</h2><p class="muted">给日常留一点空间</p><div class="room active"><span>◌</span><div>我们的日常<small>所有成员共享的房间</small></div></div><div class="sidebar-note">每次开口，<br>都有一句回应。</div></aside><section class="conversation"><header><div><p class="eyebrow">JETAIME</p><h1>我们的日常 <span class="status-dot"></span></h1></div><div class="account"><span id="current-name"></span><button id="logout" class="text-button">退出</button></div></header><main id="chat"><div class="welcome"><span>✳</span><h2>今天有什么想说的？</h2><p>和房间里的人聊聊，Jetaime 会回复“我一直都在”。</p></div><div id="messages" aria-live="polite" aria-relevant="additions"></div></main><footer><p class="notice" id="chat-error" role="alert" hidden></p><form id="composer"><textarea id="message" rows="1" maxlength="2000" required aria-label="消息内容" placeholder="聊点什么…"></textarea><button id="send" aria-label="发送消息">↑</button></form><div class="composer-meta"><span>共享房间 · <span id="connection">已连接</span></span><span>Enter 发送 · Shift + Enter 换行</span></div></footer></section></div><script src="app.js"></script></body></html>
