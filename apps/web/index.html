<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141B28" />
    <script>
      (() => {
        let theme = 'aurora'
        try {
          const saved = localStorage.getItem('jetaime.theme')
          if (['aurora', 'academic', 'cool', 'minimal'].includes(saved)) theme = saved
        } catch { /* Use the default when storage is unavailable. */ }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = { aurora: '#141B28', academic: '#181A22', cool: '#141B24', minimal: '#171921' }[theme]
      })()
    </script>
    <meta name="description" content="Jetaime 日常协同 AI 助理，让对话成为行动。" />
    <link rel="icon" type="image/png" sizes="32x32" href="/page/favicon.png" />
    <link rel="manifest" href="/page/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/page/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Jetaime" />
    <title>Jetaime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
