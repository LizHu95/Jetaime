function render(){ $('chatNav').classList.toggle('active',view==='chat');$('planNav').classList.toggle('active',view==='plan');$('chat').classList.toggle('hidden',view!=='chat');$('composer').classList.toggle('hidden',view!=='chat');$('planning').classList.toggle('hidden',view!=='plan');$('groupCount').textContent=state.groups.length;$('taskCount').textContent=state.tasks.filter(t=>t.owner==='林一'&&!t.done).length;$('groupList').innerHTML=state.groups.map(g=>`<button class="group ${g.id===groupId&&view==='chat'?'active':''}" onclick="switchGroup('${g.id}')"><span class="avatar">${escapeHTML(g.symbol)}</span><div>${escapeHTML(g.name)}<small>${g.id==='daily'?'一起安排轻松的周末':g.id==='weekend'?'周末去哪儿？一起聊聊':g.members.length+' 位成员 · 新的计划'}</small></div>${g.id==='daily'?'<span class="group-dot"></span>':''}</button>`).join('');$('headerTitle').textContent=view==='chat'?group().name:'我的规划';$('headerSub').innerHTML=view==='chat'?`<span class="dot"></span>${group().members.length} 位成员 · 一起 AI 已加入`:'把聊过的事情，一件件完成';$('headerAction').innerHTML=view==='chat'?'<span data-icon="plus"></span>邀请成员':'<span data-icon="plus"></span>新建待办';$('headerAction').onclick=view==='chat'?openInvite:()=>openTask();$('chatToolbar').classList.toggle('hidden',view!=='chat');$('sideNote').innerHTML=`<b>一点点，把计划变成日常。</b><p>今天的安排已经记下，<br>剩下的，慢慢来就好。</p><div class="side-progress"><i style="width:${state.tasks.filter(t=>t.owner==='林一').length?Math.round(state.tasks.filter(t=>t.owner==='林一'&&t.done).length/state.tasks.filter(t=>t.owner==='林一').length*100):0}%"></i></div><small>${state.tasks.filter(t=>t.owner==='林一'&&t.done).length} 项已完成 · ${state.tasks.filter(t=>t.owner==='林一'&&!t.done).length} 项等着你</small>`;renderChat();renderRight();renderPlan();iconize()}
function messageHTML(m){if(m.type)return aiHTML(m);const mine=m.sender==='林一';return `<article class="message ${mine?'mine':''}" id="${m.id}"><span class="avatar ${mine?'me':''}">${escapeHTML(m.sender.slice(0,1))}</span><div class="msg-body"><div class="sender">${escapeHTML(m.sender)}<time>${escapeHTML(m.time)}</time></div><div class="bubble">${escapeHTML(m.text)}</div>${mine?'<div class="receipt">✓ 已发送 · 演示</div>':''}</div></article>`}
function renderChat(){ $('chat').innerHTML='<div class="date"><span>演示会话 · '+(groupId==='daily'?'周末安排':'新的日常')+'</span></div>'+ (group().messages.length?group().messages.map(messageHTML).join(''):'<div class="empty">群组准备好了。<br><br>邀请成员，聊聊接下来想一起做的事。</div>')}

function scenery(kind=0){const common='viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"';if(kind===0)return `<svg ${common}><rect width="320" height="160" fill="#e6ecd0"/><circle cx="257" cy="35" r="21" fill="#f8d892"/><path d="M0 100Q55 63 126 103T320 84V160H0Z" fill="#c5d5a2"/><path d="M0 127Q100 76 180 129T320 100V160H0Z" fill="#acbe85"/><path d="M50 115 85 155H235L211 115Z" fill="#f4d6aa"/><path d="M64 130h157m-143 13h151M93 115l18 40m21-40 7 40m22-40-4 40m26-40-14 40m32-40-16 40" stroke="#d59470" stroke-width="2" opacity=".7"/><path d="M107 124q0-15 16-15t16 15" fill="none" stroke="#8d6146" stroke-width="3"/><rect x="106" y="121" width="34" height="21" rx="3" fill="#b27f52"/><path d="M108 130h30m-22-7v17m12-17v17" stroke="#dfa974" stroke-width="2"/><ellipse cx="175" cy="134" rx="18" ry="7" fill="#fff8e5"/><path d="M165 131l9-13 10 13Z" fill="#e9a867"/><rect x="65" y="69" width="7" height="59" rx="3" fill="#7e9570"/><circle cx="70" cy="64" r="29" fill="#7d9a63"/><circle cx="48" cy="69" r="19" fill="#8da675"/><circle cx="84" cy="77" r="18" fill="#739160"/><path d="m260 141 8-18m-2 7 7-5m-9 13-6-5" stroke="#789255" stroke-width="3"/></svg>`;if(kind===1)return `<svg ${common}><rect width="320" height="160" fill="#efe1cf"/><rect x="25" y="20" width="105" height="113" rx="52" fill="#c4d0bc"/><path d="M76 20v113M25 72h105" stroke="#faf2e1" stroke-width="6"/><circle cx="95" cy="44" r="15" fill="#f5d48f"/><path d="M25 103q38-29 105-9v38H25Z" fill="#a9bc97"/><rect x="186" y="20" width="71" height="38" rx="4" fill="#d0b08d"/><rect x="192" y="26" width="59" height="26" fill="#f4ecd7"/><path d="M215 44q-8-10-3-14m14 14q-8-10-3-14" fill="none" stroke="#bba484" stroke-width="2"/><path d="M0 135h320v25H0Z" fill="#c89973"/><ellipse cx="202" cy="123" rx="67" ry="12" fill="#a9704d"/><rect x="196" y="125" width="9" height="35" fill="#956a4e"/><ellipse cx="182" cy="115" rx="23" ry="7" fill="#f8ead2"/><path d="M169 95h25v17q-13 13-25 0Z" fill="#fff7e7"/><path d="M194 97q20-1 10 14h-10" stroke="#fff7e7" stroke-width="5" fill="none"/><ellipse cx="181" cy="95" rx="12" ry="3" fill="#876048"/><path d="M177 87q-8-8 1-15m8 14q-8-8 1-15" stroke="#c7b296" stroke-width="2" fill="none"/><rect x="231" y="94" width="17" height="27" rx="2" fill="#aa8260"/><path d="M240 94V65m0 19q-23-18-15-24 13 0 15 24m0-7q15-21 21-14-4 16-21 14" fill="#80986e" stroke="#80986e" stroke-width="2"/></svg>`;return `<svg ${common}><rect width="320" height="160" fill="#f0e8c8"/><rect x="0" y="0" width="320" height="95" fill="#e2e5ca"/><path d="M0 32h320M0 64h320M40 0v95m40-95v95m40-95v95m40-95v95m40-95v95m40-95v95m40-95v95" stroke="#f7f1dc" stroke-width="2"/><rect y="108" width="320" height="52" fill="#ceac81"/><rect y="100" width="320" height="9" fill="#ad8a60"/><rect x="53" y="39" width="21" height="62" rx="4" fill="#b59066"/><path d="M61 45v-12h5v12" stroke="#b59066" stroke-width="4"/><path d="M87 95V58q0-9 8-9h21q8 0 8 9v37" fill="#f8e5b1"/><path d="M89 74h33" stroke="#c8a867" stroke-width="3"/><ellipse cx="198" cy="109" rx="48" ry="14" fill="#56685b"/><path d="M152 106q8 30 46 30t46-30Z" fill="#647969"/><path d="M243 110h39" stroke="#56685b" stroke-width="9"/><ellipse cx="199" cy="106" rx="41" ry="11" fill="#f1c46d"/><path d="m174 105 10-7 12 8 15-8 13 6" fill="none" stroke="#d58157" stroke-width="5"/><path d="m184 86 3-20m12 22-3-30m16 30 6-20" stroke="#fff9e6" stroke-width="3" opacity=".7"/><circle cx="106" cy="132" r="13" fill="#d98960"/><path d="m104 120 6-6" stroke="#7b915b" stroke-width="3"/></svg>`}
function groupArt(){return `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="300" height="170" fill="#e9ecd8"/><circle cx="261" cy="36" r="21" fill="#efd998"/><path d="M0 131Q56 92 127 127t173-10v53H0Z" fill="#c8d6aa"/><path d="M0 153q70-41 147-5t153-8v30H0Z" fill="#acc591"/><path d="M230 111v50" stroke="#7f986b" stroke-width="4"/><ellipse cx="216" cy="117" rx="9" ry="22" transform="rotate(-40 216 117)" fill="#6e915f"/><ellipse cx="242" cy="101" rx="9" ry="24" transform="rotate(25 242 101)" fill="#90ac72"/><ellipse cx="246" cy="136" rx="10" ry="22" transform="rotate(45 246 136)" fill="#83a06b"/><path d="M158 143v27" stroke="#ac7959" stroke-width="4"/><circle cx="159" cy="136" r="11" fill="#f9dba9"/><path d="M145 151q13-13 26 0v19h-26Z" fill="#df9a79"/><circle cx="192" cy="144" r="9" fill="#e8c999"/><path d="M181 158q12-10 22 0v12h-22Z" fill="#7b9874"/><path d="m56 143 6-13 6 13m15 5 6-16 6 16" stroke="#8cab68" fill="none" stroke-width="2"/><path d="M38 88q8-9 16 0m13 3q6-8 12 0" stroke="#a5b286" fill="none" stroke-width="2"/></svg>`}

function aiHTML(m){let content='';if(m.type==='decision'){content=`<div class="ai-step"><span>✓ 理解聊天内容</span><span>✓ 整理双方偏好</span><span>✧ 为你们找到 3 个方向</span></div><div class="ai-heading">这个周末，给日常放个小假 <span class="pill">辅助决策</span></div><p>你们想出去透气，也想轻松一点。结合预算和时间，我更推荐<strong style="color:#537344">公园野餐</strong>：有户外的松弛感，也不用把行程排满。</p><div class="context"><span>¥ 两人预算 ≤ 200</span><span>◷ 半天就好</span><span>⌂ 离家近 · 当天往返</span></div><div class="options">${[['公园野餐','带上简单午餐，在绿意里坐坐、聊聊。','低花费 · 半天','符合双方想出去走走的想法'],['散步 + 咖啡','不设目的地，散散步，喝一杯咖啡。','适中花费 · 2–3 小时','兼顾户外活动与充分休息'],['在家做顿饭','逛一次超市，一起试一道新菜。','低花费 · 时间灵活','轻松省心，但少了户外体验']].map((o,i)=>`<div class="option ${i===0?'best':''}"><div class="scene">${scenery(i)}<span class="scene-label">0${i+1} / ${['OUTDOORS','SLOW WALK','AT HOME'][i]}</span>${i===0?'<span class="scene-label recommend-label">✧ 更推荐</span>':''}</div><div class="option-content"><b>${o[0]}</b><div class="desc">${o[1]}</div><div class="meta">${o[2]}</div><div class="fit"><i>林</i><i>夏</i>${['想透气，也不想太累','走走停停，很轻松','时间完全由你们决定'][i]}</div><button class="choose" ${m.selected?'disabled':''} onclick="choose('${m.id}',${i})">${m.selected===o[0]?'✓ 已选择':m.selected?'已完成选择':'就选这个 →'}</button><button class="option-detail" onclick="openOption(${i})">看看为什么适合</button></div></div>`).join('')}</div><div class="decision-footer"><small>概念方案 · 地点、天气与实际费用仍需确认</small><button onclick="openCompare()">对比三个方案 ↗</button></div><div class="source">依据 3 条群聊消息 <button onclick="source('m1')">小夏：想透透气</button><button onclick="source('m2')">林一：预算 ¥200</button><button onclick="source('m3')">小夏：当天回来</button></div>`}
if(m.type==='qa')content=`<div class="ai-heading">${escapeHTML(m.title||'你们之前聊过的预算')} <span class="pill">历史解答</span></div><p style="color:#4d5e44">${escapeHTML(m.text||'林一提议，两个人的周末预算控制在 200 元以内，小夏随后表示同意。')}</p>${m.source?'<div class="source">↳ 原始消息 <button onclick="source(\'m2\')">林一 · 10:25</button><button onclick="source(\'m3\')">小夏 · 10:26</button></div><div class="follow-up"><button onclick="ask(\'周末有什么合适的安排？\')">用这个预算帮我们做决定 →</button></div>':''}`;
if(m.type==='suggestion')content=`<div class="ai-heading">${m.resolved==='created'?'待办已加入规划':m.resolved==='dismissed'?'已忽略这条建议':'这件事，要记下来吗？'} <span class="pill">待办建议</span></div><p>从刚才的对话中识别到一项行动，请确认负责人和时间。</p><div class="task-suggestion"><span>☑</span><div><b>${escapeHTML(m.title)}</b><small>${escapeHTML(m.owner)} · ${escapeHTML(m.due)} · 来源：群组对话</small></div></div>${m.resolved?`<span class="sub">${m.resolved==='created'?'✓ 已创建，可在「我的规划」查看':'未创建待办'}</span>`:`<button class="solid" onclick="confirmSuggestion('${m.id}')">确认创建</button><button class="text-btn" onclick="editSuggestion('${m.id}')">修改</button><button class="text-btn" onclick="dismiss('${m.id}')">忽略</button>`}`;
if(m.type==='summary')content=`<div class="ai-heading">聊过的事，都在这里 <span class="pill">待办整理</span></div><p>以下是本群组已经确认的待办。尚未确认的建议，确认后才会加入规划。</p>${state.tasks.filter(t=>t.group===groupId&&!t.done).map(t=>`<div class="task-suggestion"><span>☑</span><div><b>${escapeHTML(t.title)}</b><small>${escapeHTML(t.owner)} · ${escapeHTML(t.due)}</small></div></div>`).join('')||'<p>本群组暂时没有已确认待办。</p>'}<button class="outline" onclick="showView('plan')">查看我的规划 ↗</button>`;
return `<article class="message assistant" id="${m.id}"><span class="avatar ai">✧</span><div class="msg-body"><div class="sender">一起 AI <span class="ai-label">日常协同助理</span><time>${m.time}</time></div><div class="ai-card">${content}</div></div></article>`}
function renderRight(){const tasks=state.tasks.filter(t=>t.group===groupId),done=tasks.filter(t=>t.done).length;$('right').innerHTML=`<div class="group-cover">${groupArt()}<div class="cover-caption"><small>TOGETHER, EVERY DAY</small><h2>${escapeHTML(group().name)}</h2><p>${groupId==='daily'?'一餐一饭，一起计划生活。':'好的计划，从一起聊聊开始。'}</p></div></div><div class="right-tabs">${[['overview','概览'],['members','成员'],['tasks','待办']].map(([k,l])=>`<button class="${rightTab===k?'active':''}" onclick="rightTab='${k}';renderRight()">${l}</button>`).join('')}</div>${rightTab==='members'?`<div class="section-head"><h2>一起生活的伙伴</h2><button onclick="openInvite()">＋ 邀请</button></div>${group().members.map(n=>`<div class="member-row"><span class="avatar ${n==='林一'?'me':''}">${escapeHTML(n[0])}</span>${escapeHTML(n)}<small>${n==='林一'?'我 · 群主':'成员'}</small></div>`).join('')}<div class="member-row"><span class="avatar ai">✧</span>一起 AI<small>协同助理</small></div><div class="rule"></div><p class="sub" style="line-height:1.9">成员共同参与聊天，AI 基于当前群组的对话提供协助。</p>`:`${rightTab==='overview'?`<div class="eyebrow">在这个小小空间里</div><div class="member-stack">${group().members.slice(0,4).map(n=>`<span class="avatar ${n==='林一'?'me':''}">${escapeHTML(n[0])}</span>`).join('')}<span class="avatar ai">✧</span><span>${group().members.length} 位成员 + 一起 AI</span></div>`:''}<div class="section-head"><h2>我们一起要做的事</h2><button onclick="openTask()">＋ 添加</button></div><div class="task-progress"><span>${done}/${tasks.length} 已完成</span><div class="bar"><i style="width:${tasks.length?done/tasks.length*100:0}%"></i></div></div>${tasks.map(t=>`<div class="task-row"><button class="check ${t.done?'done':''}" aria-label="${t.done?'恢复':'完成'}${escapeHTML(t.title)}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button><div style="flex:1"><div class="task-title ${t.done?'done':''}">${escapeHTML(t.title)}</div><div class="task-meta">${escapeHTML(t.owner)} · ${escapeHTML(t.due)} <span style="float:right;color:${t.due==='今天'?'#bc9461':'#92a77c'}">${t.done?'已完成':t.due==='今天'?'今天要做':'待完成'}</span></div></div></div>`).join('')||'<p class="sub">从对话里，把计划变成行动。</p>'}${rightTab==='overview'?`<div class="rule"></div><div class="section-head"><h2>聊天里达成的小共识</h2><button onclick="openContext()">来源 ↗</button></div><div class="summary">${groupId==='daily'?'<b>🌿 这个周末，轻松一点</b><br>两人预算不超过 200 元<br>离家近，周日晚上回家<div class="summary-tags"><span>预算</span><span>时间安排</span><span>共同偏好</span></div>':'<b>新的计划，从聊天开始</b><br>确定的事情会成为共同上下文。'}</div>`:''}`}<div class="ai-status"><div style="display:flex;align-items:center;gap:8px"><span class="avatar ai" style="width:26px;height:26px;border-radius:8px;font-size:17px">✧</span><b style="font-size:12px;color:#59714b">一起 AI · 在需要时出现</b></div><p>解答有来源，推荐有理由。<br>待办经你确认，才会加入规划。</p><button onclick="openSettings()">AI 参与方式 <span>设置 →</span></button></div>`}

function renderPlan(){let all=state.tasks.filter(t=>t.owner==='林一'),shown=all.filter(t=>filter==='done'?t.done:filter==='today'?t.due==='今天'&&!t.done:filter==='tomorrow'?t.due==='明天'&&!t.done:filter==='week'?t.due==='本周'&&!t.done:!t.done);$('planning').innerHTML=`<div class="plan-hero"><div class="eyebrow">MAKE ROOM FOR THE LITTLE THINGS</div><h2>林一，把日子过成喜欢的样子。</h2><p>你不必记住每件小事。<br>聊过的计划，我们一起慢慢完成。</p><div class="hero-art">${groupArt()}</div></div><div class="stats"><div class="stat"><span class="stat-icon">☷</span><strong>${all.filter(t=>!t.done).length.toString().padStart(2,'0')}</strong><span>等待完成的小事</span></div><div class="stat"><span class="stat-icon">☀</span><strong>${all.filter(t=>t.due==='今天'&&!t.done).length.toString().padStart(2,'0')}</strong><span>今天的安排</span></div><div class="stat"><span class="stat-icon">✓</span><strong>${all.filter(t=>t.done).length.toString().padStart(2,'0')}</strong><span>已经完成</span></div></div><div class="section-head"><h2 style="font-size:14px;margin:0">接下来的日常</h2><span class="sub">按计划时间查看</span></div><div class="calendar-strip">${[['all','全部','☷'],['today','今天','01'],['tomorrow','明天','02'],['week','本周','03']].map(([k,l,n])=>`<button class="day ${filter===k?'today':''}" onclick="filter='${k}';renderPlan()">${l}<b>${n}</b><div class="day-dot" style="opacity:${all.some(t=>!t.done&&(k==='all'||t.due===l))?1:0}"></div></button>`).join('')}<div class="day">以后<b>…</b><div class="day-dot" style="opacity:0"></div></div></div><div class="filters">${[['all','全部待办'],['today','今天'],['done','已完成']].map(([k,l])=>`<button class="filter ${filter===k?'active':''}" onclick="filter='${k}';renderPlan()">${l}</button>`).join('')}</div><div class="plan-section-title"><span>${filter==='done'?'已完成，做得不错':'每一件小事，都有来处'}</span><span>${shown.length} 项</span></div>${shown.map(t=>`<div class="plan-item"><button class="check ${t.done?'done':''}" aria-label="${t.done?'恢复':'完成'}${escapeHTML(t.title)}" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button><div class="content"><b class="${t.done?'task-title done':''}">${escapeHTML(t.title)}</b><small><span class="task-group-tag">${escapeHTML(state.groups.find(g=>g.id===t.group)?.name||'个人')}</span>${escapeHTML(t.source)}</small></div><span class="due-badge">${escapeHTML(t.due)}</span><button class="text-btn" onclick="openTask('${t.id}')">编辑</button><button class="text-btn" onclick="switchGroup('${t.group}')">回到群聊 ↗</button></div>`).join('')||'<div class="empty">这里暂时没有待办。给自己留一点空白。</div>'}<div class="ai-intro" style="margin-top:24px"><span class="avatar ai">✧</span><div><b style="color:#92754f">从聊天到行动，少一点遗漏。</b><br>在群聊里说「我来准备午餐」，一起 AI 会帮你记成待办建议。</div></div>`}

function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}function time(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function scrollChat(){requestAnimationFrame(()=>$('chat').scrollTop=$('chat').scrollHeight)}
function toggleTask(tid){const t=state.tasks.find(t=>t.id===tid);t.done=!t.done;save();render();toast(t.done?'已完成，今天又前进了一点':'待办已恢复')}
function choose(mid,i){const m=group().messages.find(m=>m.id===mid);if(m.selected)return;const titles=['公园野餐','散步 + 咖啡','在家做顿饭'];m.selected=titles[i];group().messages.push({id:id(),sender:'林一',text:'那就选'+titles[i]+'吧！',time:time()},{id:id(),type:'suggestion',title:['确认野餐地点并准备午餐','确定散步路线','列好菜单并买菜'][i],owner:'林一',due:'明天',time:time()});save();render();scrollChat()}
function confirmSuggestion(mid){const m=group().messages.find(m=>m.id===mid);if(m.resolved)return;m.resolved='created';state.tasks.push({id:id(),title:m.title,owner:m.owner,due:m.due,group:groupId,done:false,source:'AI 提取 · 已确认'});save();render();toast('已创建待办 · '+m.owner+'负责')}
function dismiss(mid){group().messages.find(m=>m.id===mid).resolved='dismissed';save();render()}
function sendMessage(e){e?.preventDefault();const text=$('messageInput').value.trim();if(!text)return;const isAI=aiOn||/@一起|@AI/i.test(text);group().messages.push({id:id(),sender:'林一',text,time:time()});$('messageInput').value='';aiOn=false;$('aiToggle').style.background='';let m=null;const hasContext=group().messages.some(m=>m.id==='m2');if(isAI){if(/预算|之前|历史/.test(text))m=hasContext&&/预算/.test(text)?{type:'qa',source:true}:{type:'qa',title:'还需要一点线索',text:'目前的演示历史中，没有找到这条问题的确切依据。可以补充想查的事情或时间。'};else if(/待办|任务|整理/.test(text))m={type:'summary'};else if(/安排|周末|决定|选|推荐/.test(text))m=hasContext?{type:'decision'}:{type:'qa',title:'先了解大家的想法',text:'这段聊天还没有明确的预算和时间。可以先聊聊想做什么、什么时候有空，以及大概的预算。'};else m={type:'qa',title:'一起 AI · 演示回答',text:'当前原型可体验历史预算问答、周末候选比较和待办整理。正式版本将在这里结合本群聊天历史回答你的问题。'}}else if(proactive&&/记得|提醒|我负责|我来|我要/.test(text)){m={type:'suggestion',title:text.replace(/^(我来|我要|我负责|提醒我|记得)/,'').trim()||text,owner:'林一',due:/明天/.test(text)?'明天':/今天|今晚/.test(text)?'今天':'待定'}}if(m)group().messages.push({id:id(),time:time(),...m});save();render();scrollChat()}
function ask(text){$('messageInput').value='@一起 '+text;sendMessage()}
function toggleAI(){aiOn=!aiOn;$('aiToggle').style.background=aiOn?'#dce8d3':'';$('messageInput').focus();$('messageInput').placeholder=aiOn?'向一起 AI 提问…':'说点什么，或 @一起 请 AI 帮忙…'}
function source(mid){const e=$(mid);if(!e){toast('请在「我们的日常」查看这条演示消息');return}e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('highlight');setTimeout(()=>e.classList.remove('highlight'),2400)}
function modal(html){lastFocus=document.activeElement;$('modal').innerHTML=html;$('overlay').classList.remove('hidden');requestAnimationFrame(()=>$('modal').querySelector('input,button,select')?.focus())}function closeModal(){$('overlay').classList.add('hidden');lastFocus?.focus()}
function openCreate(){modal(`<div class="detail-kicker">A NEW LITTLE SPACE</div><h2 id="modalTitle">创建一个群组</h2><p>和重要的人一起聊天、做决定、完成计划。一起 AI 会加入群组。</p><form onsubmit="createGroup(event)"><label for="groupName">群组名称</label><input id="groupName" placeholder="例如：我们的日常、周末搭子" maxlength="24" required><div class="modal-actions"><button type="button" class="text-btn" onclick="closeModal()">取消</button><button class="solid">创建群组</button></div></form>`)}
function createGroup(e){e.preventDefault();const name=$('groupName').value.trim();if(!name){$('groupName').setCustomValidity('请输入群组名称');$('groupName').reportValidity();$('groupName').oninput=()=> $('groupName').setCustomValidity('');return}const g={id:id(),name,symbol:'♧',members:['林一'],messages:[]};state.groups.push(g);save();switchGroup(g.id);toast('群组已创建，邀请成员一起加入');openInvite()}
function resetDemo(){localStorage.removeItem('together-demo-v1');localStorage.removeItem('together-demo-proactive');location.reload()}
function openGroups(){modal(`<h2 id="modalTitle">我的群组</h2>${state.groups.map(g=>`<button class="group" onclick="switchGroup('${g.id}')"><span class="avatar">${escapeHTML(g.symbol)}</span>${escapeHTML(g.name)}</button>`).join('')}<div class="modal-actions"><button class="text-btn" onclick="resetDemo()">重置演示</button><button class="text-btn" onclick="closeModal()">关闭</button><button class="solid" onclick="openCreate()">＋ 创建群组</button></div>`)}
function openInvite(){modal(`<div class="detail-kicker">GOOD THINGS ARE BETTER TOGETHER</div><h2 id="modalTitle">邀请成员，一起规划日常</h2><p>邀请朋友加入「${escapeHTML(group().name)}」，一起讨论与规划。</p><div class="invite-code">${groupId==='daily'?'YQ 2026':groupId.slice(-6).toUpperCase()}</div><p style="text-align:center">演示邀请码 · 正式版本将支持邀请链接</p><label for="inviteName">体验加入流程：成员昵称</label><input id="inviteName" placeholder="例如：小北" maxlength="16"><div class="modal-actions"><button class="text-btn" onclick="closeModal()">关闭</button><button class="solid" onclick="simulateJoin()">模拟成员加入</button></div>`)}
function simulateJoin(){const n=$('inviteName').value.trim();if(!n){$('inviteName').focus();toast('先填写新成员的昵称');return}if(group().members.includes(n)){toast('这位成员已在群组中');return}group().members.push(n);group().messages.push({id:id(),sender:n,text:'我加入啦，一起安排接下来的计划吧！',time:time()});save();closeModal();render();scrollChat();toast(n+'已加入群组（演示）')}
function openTask(tid,suggestionId){const t=tid?state.tasks.find(t=>t.id===tid):suggestionId?group().messages.find(m=>m.id===suggestionId):null;modal(`<h2 id="modalTitle">${suggestionId?'修改待办建议':tid?'编辑待办':'新建待办'}</h2><p>明确一件事，给它一个合适的时间。</p><form onsubmit="saveTask(event,'${tid||''}','${suggestionId||''}')"><label for="taskTitle">要做什么</label><input id="taskTitle" value="${escapeHTML(t?.title||'')}" required maxlength="100" placeholder="例如：准备野餐午餐"><label for="taskOwner">负责人</label><select id="taskOwner">${(tid?state.groups.find(g=>g.id===t.group):group()).members.map(n=>`<option ${n===(t?.owner||'林一')?'selected':''}>${escapeHTML(n)}</option>`).join('')}</select><label for="taskDue">计划时间</label><select id="taskDue">${['今天','明天','本周','待定'].map(d=>`<option ${d===(t?.due||'今天')?'selected':''}>${d}</option>`).join('')}</select><div class="modal-actions"><button type="button" class="text-btn" onclick="closeModal()">取消</button><button class="solid">${suggestionId?'保存建议':tid?'保存修改':'创建待办'}</button></div></form>`)}
function editSuggestion(mid){openTask(null,mid)}
function saveTask(e,tid,sid){e.preventDefault();const title=$('taskTitle').value.trim();if(!title){toast('请填写待办内容');return}const data={title,owner:$('taskOwner').value,due:$('taskDue').value};if(sid)Object.assign(group().messages.find(m=>m.id===sid),data);else if(tid)Object.assign(state.tasks.find(t=>t.id===tid),data);else state.tasks.push({id:id(),...data,group:groupId,done:false,source:'手动创建'});save();closeModal();render();toast(sid?'建议已修改，确认后创建':tid?'待办已更新':'待办已创建')}

function searchGroups(q){document.querySelectorAll('#groupList .group').forEach(el=>el.classList.toggle('hidden',!el.textContent.includes(q.trim())))}
function openOption(i){const data=[['公园野餐','出门透气，节奏自己掌握','满足小夏「想出去透气」的想法，也符合林一「不安排太满」的要求。自备午餐通常更容易控制预算。','需要确认天气、公园规则与交通距离；预算为方向性判断，尚未核实实际费用。','确认野餐地点 → 准备午餐 → 整理随身物品'],['散步 + 咖啡','走走停停，给彼此留点时间','兼顾户外体验与休息，行程可以随时缩短。适合不想准备太多、又想出门的你们。','饮品与交通费用需确认；选择离家近的路线，避免行程太长。','确定散步路线 → 选择休息点 → 确认出发时间'],['在家做顿饭','用一顿饭，让周末慢下来','没有交通负担，时间灵活，容易保持轻松节奏。两人一起完成也有共同参与感。','不完全满足小夏「出去透气」的想法，可以加一个短途买菜安排。','选一道菜 → 列购物清单 → 分配准备工作']][i];modal(`<div class="detail-kicker">OPTION 0${i+1} · 候选方案</div><h2 id="modalTitle">${data[0]}</h2><p>${data[1]}</p><div class="detail-scene">${scenery(i)}</div><div class="detail-row"><b>为什么适合你们</b>${data[2]}</div><div class="detail-row"><b>还需要确认</b>${data[3]}</div><div class="detail-row"><b>选定之后，可以这样推进</b>${data[4]}</div><div class="modal-actions"><button class="solid" onclick="closeModal()">回到候选</button></div>`)}
function openCompare(){modal(`<div class="detail-kicker">LET'S DECIDE TOGETHER</div><h2 id="modalTitle">哪种周末，更像你们想要的？</h2><p>优先考虑户外体验、轻松程度和预算。以下为演示比较，实际条件仍需确认。</p>${[['🌿 公园野餐','户外体验较好 · 需要准备午餐','更贴合双方当前想法'],['☕ 散步 + 咖啡','准备少 · 花费取决于饮品与交通','方便随时调整行程'],['🍳 在家做顿饭','时间自由 · 需要买菜和做饭','省心，但户外体验较少']].map(d=>`<div class="detail-row"><b>${d[0]}</b>${d[1]}<br><span style="color:#9c977b">${d[2]}</span></div>`).join('')}<div class="modal-actions"><button class="solid" onclick="closeModal()">回到候选，做个选择</button></div>`)}
function openContext(){modal(`<div class="detail-kicker">SHARED CONTEXT · 本群组</div><h2 id="modalTitle">聊天里达成的小共识</h2><p>用于本群 AI 解答与推荐的上下文，点击可回到原始消息。</p>${groupId==='daily'?`<button class="search-result" onclick="closeModal();source('m1')"><b>想出去透透气</b><small>小夏 · 10:24 · 当前聊天</small></button><button class="search-result" onclick="closeModal();source('m2')"><b>两人预算 ≤ 200 元，别安排太满</b><small>林一 · 10:25 · 当前聊天</small></button><button class="search-result" onclick="closeModal();source('m3')"><b>离家近，周日晚上回来</b><small>小夏 · 10:26 · 当前聊天</small></button>`:'<div class="empty">还没有形成明确的共识。</div>'}<p>这次计划的条件不会自动成为长期偏好。</p><div class="modal-actions"><button class="solid" onclick="closeModal()">知道了</button></div>`)}
function openSearch(){modal(`<h2 id="modalTitle">查找聊过的事情</h2><p>搜索「${escapeHTML(group().name)}」中的消息。</p><input id="historySearch" aria-label="搜索聊天消息" placeholder="输入关键词，例如：预算、周末" oninput="renderSearch(this.value)"><div id="searchResults"><p>输入关键词，找到对话中的线索。</p></div><div class="modal-actions"><button class="text-btn" onclick="closeModal()">关闭</button></div>`)}
function renderSearch(q){const hits=q.trim()?group().messages.filter(m=>m.text&&!m.type&&m.text.includes(q.trim())):[];$('searchResults').innerHTML=hits.length?hits.map(m=>`<button class="search-result" onclick="closeModal();source('${m.id}')">${escapeHTML(m.text)}<small>${escapeHTML(m.sender)} · ${escapeHTML(m.time)} · 点击查看来源</small></button>`).join(''):q.trim()?'<p>没有找到相关消息，换个关键词试试。</p>':'<p>输入关键词，找到对话中的线索。</p>'}
function openSettings(){modal(`<div class="detail-kicker">A QUIET LITTLE HELPER</div><h2 id="modalTitle">AI 在什么时候参与？</h2><p>日常聊天保持自在，需要时让一起帮一把。</p><div class="setting-row"><div><b>@一起 或快捷提问</b><small>主动提问时，结合群聊上下文回答</small></div><span class="pill">始终开启</span></div><div class="setting-row"><div><b>识别明确的行动</b><small>生成待办建议，确认后才创建</small></div><button class="switch ${proactive?'on':''}" role="switch" aria-checked="${proactive}" aria-label="识别明确的行动" onclick="proactive=!proactive;localStorage.setItem('together-demo-proactive',proactive?'on':'off');this.classList.toggle('on',proactive);this.setAttribute('aria-checked',proactive)"></button></div><div class="setting-row"><div><b>当前可读取的内容</b><small>本群组的演示消息与已确认待办</small></div><span class="pill">仅限本群</span></div><div class="modal-actions"><button class="solid" onclick="closeModal()">保存设置</button></div>`)}
function openGroupDetails(){modal(`<div class="group-cover">${groupArt()}<div class="cover-caption"><small>TOGETHER, EVERY DAY</small><h2 id="modalTitle">${escapeHTML(group().name)}</h2><p>${group().members.length} 位成员 · 一起 AI 已加入</p></div></div>${group().members.map(n=>`<div class="member-row"><span class="avatar ${n==='林一'?'me':''}">${escapeHTML(n[0])}</span>${escapeHTML(n)}<small>${n==='林一'?'我 · 群主':'成员'}</small></div>`).join('')}<div class="modal-actions"><button class="text-btn" onclick="openSettings()">AI 设置</button><button class="solid" onclick="openInvite()">邀请成员</button><button class="text-btn" onclick="closeModal()">关闭</button></div>`)}

let toastTimer;function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('overlay').classList.contains('hidden')){const a=[...$('modal').querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});render();
</script>
</body>
</html>
