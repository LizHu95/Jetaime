server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Optional TLS listeners survive normal deployments. No matching files is OK.
    include /etc/nginx/jetaime-tls/*.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        return 302 /page/auth/login/;
    }
    location = /page {
        return 302 /page/;
    }
    location = /page/sw.js {
        alias /var/www/jetaime/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }
    location = /page/manifest.webmanifest {
        alias /var/www/jetaime/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location /page/ {
        alias /var/www/jetaime/;
        index index.html;
        # Revalidate the SPA entry so browser reloads discover new asset hashes.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /page/index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location = /test/healthz {
        proxy_pass http://127.0.0.1:8081;
    }
    location / {
        return 404;
    }
}
